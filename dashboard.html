<style>
/* ═══ デザイントークン（Claudeデザイン モック準拠・README確定値） ═══ */
html,body{margin:0;padding:0;background:#f4f6f9}
.dsroot{--bg:#f4f6f9;--surface:#ffffff;--surface2:#eef1f5;--text:#141c2b;--sub:#66707f;
  --border:#e2e7ee;--accent:#2f66d0;--accent-strong:#2554b4;--accent-soft:#e8effc;
  --red:#d6455d;--red-soft:#fdecef;--orange:#d9821f;--orange-soft:#fdf1e3;
  --green:#199b6e;--green-soft:#e4f6ee;--purple:#7a5bd6;--purple-soft:#efeafc;
  --chat-self:#c4edca;--chat-self-text:#1b3a24;
  --shadow:0 1px 2px rgba(20,28,43,.05),0 4px 14px rgba(20,28,43,.05)}
.dsroot[data-theme="dark"]{--bg:#0f131a;--surface:#171d27;--surface2:#1f2732;--text:#e9edf4;
  --sub:#8b96a8;--border:#28313f;--accent:#6b96e8;--accent-strong:#89abee;--accent-soft:#1d2a45;
  --red:#e57085;--red-soft:#3a2029;--orange:#e39b4d;--orange-soft:#3a2c1a;
  --green:#3fc492;--green-soft:#173327;--purple:#a08ae8;--purple-soft:#2a2342;
  --chat-self:#2c5237;--chat-self-text:#d9f2dc;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25)}
body[data-theme-body="dark"]{background:#0f131a}

.dsroot{display:flex;min-height:100vh;background:var(--bg);color:var(--text);
  font-family:'IBM Plex Sans JP',sans-serif;font-size:14px;line-height:1.6}
a{color:var(--accent);text-decoration:none;cursor:pointer}
a:hover{color:var(--accent-strong)}

/* ═══ サイドバー ═══ */
aside.side{width:232px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);
  display:flex;flex-direction:column;padding:20px 12px;gap:2px;position:sticky;top:0;height:100vh;
  box-sizing:border-box}
.side .brand{display:flex;align-items:center;gap:10px;padding:4px 12px 18px}
.side .brand .mark{width:30px;height:30px;border-radius:8px;background:var(--accent);display:flex;
  align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:13px;letter-spacing:.02em}
.side .brand b{font-weight:700;font-size:15px;line-height:1.2;display:block}
.side .brand small{font-size:11px;color:var(--sub)}
.side a.item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;
  color:var(--sub);cursor:pointer;font-size:14px}
.side a.item:hover{background:var(--surface2);color:var(--text)}
.side a.item.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.side a.item svg{flex-shrink:0}
.side a.item .navbadge{margin-left:auto;background:var(--red);color:#fff;font-size:11px;
  font-weight:600;border-radius:99px;padding:1px 7px}
.side .theme-btn{display:flex;align-items:center;justify-content:center;gap:8px;margin:4px 4px 0;
  padding:9px;border-radius:8px;border:1px solid var(--border);background:var(--surface);
  color:var(--sub);font-family:inherit;font-size:13px;font-weight:500;cursor:pointer}
.side .theme-btn:hover{background:var(--surface2);color:var(--text)}
@media (max-width:820px){
  .dsroot{flex-direction:column}
  aside.side{width:100%;height:auto;position:static;flex-direction:row;flex-wrap:wrap;
    padding:8px;border-right:none;border-bottom:1px solid var(--border)}
  .side .brand{display:none}
  .side a.item{padding:7px 10px;font-size:12.5px}
  .side a.item svg{display:none}
  .side .theme-btn{margin:0}
}

/* ═══ メイン・ヘッダー ═══ */
main{flex:1;min-width:0;padding:24px 28px 40px;box-sizing:border-box;display:flex;
  flex-direction:column;gap:20px}
header.ph{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
header.ph .tt{margin-right:auto}
header.ph h1{margin:0;font-size:20px;font-weight:700}
header.ph .ps{font-size:12px;color:var(--sub);margin-top:2px}

/* ═══ カード ═══ */
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;
  padding:18px 20px;box-shadow:var(--shadow)}
.card-c{padding:14px 16px}
.card.bl-red{border-left:4px solid var(--red)}
.card.bl-orange{border-left:4px solid var(--orange)}
.card.bl-green{border-left:4px solid var(--green)}
.card.bl-purple{border-left:4px solid var(--purple)}
.sec-h{font-weight:600;font-size:14px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:1100px){.g4{grid-template-columns:repeat(2,1fr)}}
@media (max-width:700px){.g4,.g2{grid-template-columns:1fr}}

/* ═══ KPI ═══ */
.kpi-lbl{font-size:12px;color:var(--sub);font-weight:500}
.kpi-num{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;
  letter-spacing:-.01em;margin-top:6px}
.kpi-num small{font-size:15px;font-weight:500;color:var(--sub);letter-spacing:0}
.kpi-sub{font-size:12px;margin-top:4px}
.kpi-sub .dim{color:var(--sub);font-weight:400}
.up{color:var(--green);font-weight:600}.down{color:var(--red);font-weight:600}

/* ═══ バッジ・ピル ═══ */
.badge{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:3px 10px;

.badge .dot{width:6px;height:6px;border-radius:99px}
.pill{display:inline-flex;align-items:center;border-radius:99px;font-size:11px;font-weight:700;
  padding:1px 8px;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill.red{background:var(--red-soft);color:var(--red)}
.pill.orange{background:var(--orange-soft);color:var(--orange)}
.pill.green{background:var(--green-soft);color:var(--green)}
.pill.purple{background:var(--purple-soft);color:var(--purple)}
.pill.accent{background:var(--accent-soft);color:var(--accent)}
.pill.gray{background:var(--surface2);color:var(--sub)}

/* ═══ ボタン・入力 ═══ */
.btn{height:36px;padding:0 16px;border-radius:8px;border:none;background:var(--accent);color:#fff;
  font-family:inherit;font-size:13px;font-weight:600;cursor:pointer}
.btn:hover{background:var(--accent-strong)}
.btn2{height:36px;padding:0 16px;border-radius:8px;border:1px solid var(--border);
  background:var(--surface);color:var(--text);font-family:inherit;font-size:13px;font-weight:500;cursor:pointer}
.btn2:hover{background:var(--surface2)}
.btnd{height:36px;padding:0 16px;border-radius:8px;border:1px solid var(--red);background:transparent;
  color:var(--red);font-family:inherit;font-size:13px;font-weight:600;cursor:pointer}
.btnd:hover{background:var(--red-soft)}
.btn.sm,.btn2.sm,.btnd.sm{height:32px;padding:0 14px;font-size:12px}
.btn.xs,.btn2.xs,.btnd.xs{height:28px;padding:0 12px;font-size:12px;border-radius:6px}
.sel{height:36px;border:1px solid var(--border);border-radius:8px;background:var(--surface);
  color:var(--text);font-family:inherit;font-size:13px;padding:0 10px;cursor:pointer}
.searchbox{display:flex;align-items:center;gap:8px;background:var(--surface);
  border:1px solid var(--border);border-radius:8px;padding:0 12px;height:36px;width:240px;
  box-sizing:border-box;color:var(--sub)}
.searchbox:focus-within{border-color:var(--accent)}
.searchbox input{border:none;outline:none;background:transparent;font-family:inherit;
  font-size:13px;color:var(--text);width:100%}
.tinput{height:36px;border:1px solid var(--border);border-radius:8px;background:var(--surface);
  color:var(--text);font-family:inherit;font-size:13px;padding:0 12px;box-sizing:border-box}
.tinput:focus{outline:none;border-color:var(--accent)}

/* ═══ テーブル ═══ */
.tblwrap{overflow-x:auto}
table.dt{width:100%;border-collapse:collapse;font-size:13px}
table.dt th{text-align:left;padding:10px 14px;font-weight:500;font-size:12px;color:var(--sub);
  border-bottom:1px solid var(--border);white-space:nowrap}
table.dt th:first-child{padding-left:20px}
table.dt th:last-child{padding-right:20px}
table.dt th.sortable{cursor:pointer;user-select:none}
table.dt th.sortable:hover{color:var(--text)}
table.dt th.num,table.dt td.num{text-align:right}
table.dt th.ctr,table.dt td.ctr{text-align:center}
table.dt td{padding:10px 14px;border-bottom:1px solid var(--border);white-space:nowrap;
  font-variant-numeric:tabular-nums}
table.dt td:first-child{padding-left:20px}
table.dt td:last-child{padding-right:20px}
table.dt tbody tr:hover{background:var(--surface2)}
table.dt tbody tr:last-child td{border-bottom:none}
.tbl-head{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--border)}
.tbl-foot{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;
  font-size:12px;color:var(--sub)}
.card.nopad{padding:0;overflow:hidden}

/* ═══ 進捗バー ═══ */
.track{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden}
.track>span{display:block;height:100%;border-radius:99px}
.track.mini{height:6px}
.bar-row{display:flex;justify-content:space-between;font-size:12px;margin-bottom:6px}
.bar-row .n{font-weight:500}.bar-row .v{color:var(--sub);font-variant-numeric:tabular-nums}

/* ═══ チャット（LINE風） ═══ */
.chatbox{background:var(--bg);border-radius:10px;padding:16px 18px;display:flex;
  flex-direction:column;gap:10px;max-height:420px;overflow-y:auto}
.msg{display:flex;gap:8px;align-items:flex-end;max-width:78%}
.msg .bub{padding:9px 13px;font-size:13px;line-height:1.6;white-space:pre-wrap;word-break:break-word}
.msg.them{align-self:flex-start}
.msg.them .bub{background:var(--surface);border:1px solid var(--border);border-radius:14px 14px 14px 4px}
.msg.me{align-self:flex-end;flex-direction:row-reverse}
.msg.me .bub{background:var(--chat-self);color:var(--chat-self-text);border-radius:14px 14px 4px 14px}
.msg .ts{font-size:10px;color:var(--sub);white-space:nowrap}
.ptab{height:26px;border-radius:99px;padding:0 12px;font-size:12px;display:inline-flex;
  align-items:center;gap:6px;cursor:pointer;border:1px solid var(--border);background:transparent;
  color:var(--sub);font-family:inherit}
.ptab.on{background:var(--accent-soft);color:var(--accent);border-color:var(--accent);font-weight:600}
.ctab{padding:8px 12px;border-bottom:2px solid transparent;display:inline-flex;align-items:center;
  gap:8px;cursor:pointer;font-size:13px;color:var(--sub)}
.ctab.on{border-bottom-color:var(--accent);color:var(--accent);font-weight:600}
.avatar{width:22px;height:22px;border-radius:99px;background:var(--accent-soft);color:var(--accent);
  display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0}

/* ═══ その他 ═══ */
.note{font-size:11px;color:var(--sub);line-height:1.6}
.empty{font-size:12.5px;color:var(--sub);border:1px dashed var(--border);border-radius:10px;
  padding:12px 14px}
.loading{color:var(--sub);padding:2rem 0;text-align:center;font-size:13px}
.errbox{white-space:pre-wrap;color:var(--red);font-size:11.5px;background:var(--surface);
  border:1px solid var(--border);border-radius:10px;padding:12px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#141c2b;
  color:#fff;padding:9px 18px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .2s;
  pointer-events:none;z-index:60}
.toast.show{opacity:1}
details.fold{border:1px solid var(--border);border-radius:12px;background:var(--surface);
  box-shadow:var(--shadow);padding:14px 16px}
details.fold summary{cursor:pointer;font-size:13px;font-weight:600}
details.fold summary .cnt{color:var(--sub);font-weight:400;font-size:12px}
.dropzone{border:2px dashed var(--border);border-radius:10px;padding:18px;text-align:center;
  color:var(--sub);font-size:13px;margin:10px 0}
.alink{font-size:12px}
.num6{font-weight:600;font-variant-numeric:tabular-nums}
.stepnum{width:22px;height:22px;border-radius:99px;background:var(--accent);color:#fff;
  display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0}
.demo-note{margin:0 10px 12px;padding:11px 12px;border-radius:10px;
  background:var(--accent-soft);color:var(--accent);font-size:11.5px;line-height:1.7}
.demo-note b{display:block;font-size:12.5px;margin-bottom:3px}
.demo-note span{display:block;margin-top:7px;color:var(--sub)}
.demo-note span b{display:inline;font-size:11.5px;color:var(--text)}
.demo-note a{display:block;margin-top:9px;color:var(--accent);font-weight:600;text-decoration:underline}
</style>

<script>
/* /api/admin/dashboard/* への fetch を、架空データの応答に差し替える。
   本番のスクリプトは一行も変えていないので、この差し込みを外せば元に戻る。 */
(function(){
  "use strict";
  var D = window.__AIBO_DEMO__ || {};
  var norm = function(s){ return String(s||"").trim().replace(/^[@＠]/,"").toLowerCase(); };
  var ok = function(body){ return Promise.resolve({
    ok:true, status:200,
    json: function(){ return Promise.resolve(body); },
    text: function(){ return Promise.resolve(""); }
  }); };
  var real = window.fetch.bind(window);
  window.fetch = function(input, init){
    var url = typeof input === "string" ? input : (input && input.url) || "";
    if(url.indexOf("/api/admin/dashboard/") === -1) return real(input, init);
    if(init && init.method && init.method.toUpperCase() !== "GET"){
      return ok({ok:true, demo:true, message:"サンプルのため保存されません"});
    }
    var path = url.split("?")[0].replace(/.*\/api\/admin\/dashboard/, "");
    var qs = new URLSearchParams(url.split("?")[1] || "");
    if(path === "/data")     return ok(D.data);
    if(path === "/results")  return ok(D.results);
    if(path === "/creators") return ok(D.creators);
    if(path === "/rewards")  return ok(D.rewards);
    if(path === "/creator"){
      var d = (D.details || {})[norm(qs.get("u"))];
      return ok(d || {empty:true, message:"サンプルにはこの方のデータがありません。"});
    }
    return ok({empty:true, message:"この画面はサンプルに含まれていません。"});
  };
})();
</script>

/* ═══ テーマ ═══ */
function applyTheme(){
  const pref = localStorage.getItem("aibo-theme") ||
    (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  $("#dsroot").setAttribute("data-theme", pref);
  document.body.setAttribute("data-theme-body", pref);

});

function kpiTile(lbl, numHTML, subHTML, extraHTML=""){
  return `<div class="card">${lbl}${numHTML}${subHTML}${extraHTML}</div>`;
}
const ST = {

  no_data:  {label:"データなし", bg:"transparent",       color:"var(--sub)",    dot:"var(--border)", border:"1px dashed var(--border)"},
  withdrawn:{label:"退会",     bg:"var(--surface2)",    color:"var(--sub)",    dot:"var(--sub)",    border:"1px solid transparent"},
};
function stKey(r){ return (r.bucket === "active" && r.tenure < 90) ? "newbie" : r.bucket; }

  return `<span class="badge" style="background:${s.bg};color:${s.color};border:${s.border}">
    <span class="dot" style="background:${s.dot}"></span>${s.label}</span>`;
}
function barColor(p){ return p >= 100 ? "var(--accent)" : p >= 60 ? "var(--green)"
  : p >= 30 ? "var(--orange)" : "var(--red)"; }

/* 棒グラフ（div方式・当月のみ不透明） */
function divBars(items, color){
  const max = Math.max(...items.map(i => i.value), 1);
  return `<div style="display:flex;align-items:flex-end;gap:14px;height:150px;margin-top:18px;padding:0 6px">`
    + items.map((it, i) => {
      const last = i === items.length - 1;
      const h = Math.max(it.value / max * 76, it.value > 0 ? 2 : 1.2);
      return `<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end">
        <div style="font-size:11px;${last ? `font-weight:700;color:${color}` : "color:var(--sub)"};font-variant-numeric:tabular-nums">${esc(it.display ?? it.value)}</div>
        <div style="width:100%;max-width:44px;height:${h.toFixed(1)}%;border-radius:6px 6px 2px 2px;background:${color};${last ? "" : "opacity:.45;"}"></div>
        <div style="font-size:11px;${last ? "font-weight:600" : "color:var(--sub)"}">${esc(it.label)}</div></div>`;
    }).join("") + `</div>`;
}
/* 折れ線（svg・グリッド3本・最新点に円＋ラベル） */
function lineSVG(labels, series, fmtFn){
  const W=560, H=150, padL=34, padR=34, top=20, bottom=118;
  // 最新値ラベルは点の12px上に置くので、最高点が上端に張り付かないよう余白を持たせる
  const max = Math.max(...series.flatMap(s => s.values), 1) * 1.15;
  const X = i => padL + (W-padL-padR) * (labels.length === 1 ? .5 : i/(labels.length-1));
  const Y = v => bottom - (bottom-top) * v / max;
  let s = `<svg viewBox="0 0 560 150" style="width:100%;height:150px;margin-top:18px;display:block">`;
  [10,65,120].forEach(y => s += `<line x1="0" y1="${y}" x2="560" y2="${y}" stroke="var(--border)" stroke-width="1"/>`);
  series.forEach(sr => s += `<polyline points="${sr.values.map((v,i)=>X(i).toFixed(1)+","+Y(v).toFixed(1)).join(" ")}"
    fill="none" stroke="${sr.color}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`);
  // 最新値ラベル: 全系列に出す。近接して重なる系列は点の下へ逃がす
  const ends = series.map((sr, si) => {
    const i = sr.values.length - 1;
    return {si, color: sr.color, x: X(i), y: Y(sr.values[i]), v: sr.values[i]};
  }).sort((a, b) => a.y - b.y);
  const labelY = {};
  ends.forEach((e, idx) => {
    let ly = Math.max(13, e.y - 12);
    if(idx > 0 && Math.abs(ly - labelY[ends[idx-1].si]) < 14) ly = Math.min(132, e.y + 16);
    labelY[e.si] = ly;
  });
  series.forEach((sr, si) => {
    const i = sr.values.length - 1;
    s += `<circle cx="${X(i).toFixed(1)}" cy="${Y(sr.values[i]).toFixed(1)}" r="4" fill="${sr.color}"/>`;
    s += `<text x="${X(i).toFixed(1)}" y="${labelY[si].toFixed(1)}" text-anchor="middle"
      font-size="11" font-weight="700" fill="${sr.color}" font-family="IBM Plex Sans JP">${fmtFn ? fmtFn(sr.values[i]) : sr.values[i]}</text>`;
  });
  labels.forEach((lb, i) => s += `<text x="${X(i).toFixed(1)}" y="138" text-anchor="middle" font-size="10"
    fill="var(--sub)" font-family="IBM Plex Sans JP">${esc(lb)}</text>`);
  return s + `</svg>`;
}
function legend(items){
  return `<div style="display:flex;gap:14px;font-size:12px;color:var(--sub)">` + items.map(([c, l]) =>
    `<span style="display:flex;align-items:center;gap:6px"><span style="width:10px;height:3px;border-radius:2px;background:${c}"></span>${esc(l)}</span>`).join("") + `</div>`;
}
function downloadCSV(name, headers, rows){
  const csv = "﻿" + [headers, ...rows].map(r =>
    r.map(c => `"${String(c ?? "").replace(/"/g, '""')}"`).join(",")).join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv], {type: "text/csv"}));
  a.download = name; a.click();
}

/* ═══ 対象月（全ページ共通の状態・URLに残す） ═══ */
let MONTH = "";           // "" = 最新の月
function monthQS(extra){  // APIに付ける ?month=
  const p = [];
  if(MONTH) p.push("month=" + encodeURIComponent(MONTH));
  if(extra) p.push(extra);
  return p.length ? "?" + p.join("&") : "";
}
const monthLabel = m => m ? `${+m.slice(0,4)}年${+m.slice(5,7)}月` : "";
function monthSelect(months, current){
  if(!months || !months.length) return "";
  const opts = months.map(m =>
    `<option value="${m}" ${m === current ? "selected" : ""}>${monthLabel(m)}</option>`).join("");
  return `<label style="display:flex;align-items:center;gap:6px;font-size:12px;color:var(--sub)">対象月
    <select class="sel" id="month-sel">${opts}</select></label>`;
}
function bindMonthSelect(){
  const el = $("#month-sel");
  if(el) el.addEventListener("change", e => { MONTH = e.target.value; route(); });
}

const routes = {home: pgHome, creators: pgCreators, creator: pgCreator, push: pgPush,
                results: pgResults, ops: pgOps, collab: pgCollab, data: pgData};
async function route(){
  const hash = location.hash.replace(/^#/, "") || "home";
  const [page, arg] = hash.split("=");
  document.querySelectorAll("aside.side a.item").forEach(a =>
    a.classList.toggle("on", a.getAttribute("href") === "#" + (page === "creator" ? "creators" : page)));
  const fn = routes[page] || pgHome;
  const main = $("#main");
  main.innerHTML = '<div class="loading">読み込み中…</div>';
  try{ await fn(main, decodeURIComponent(arg || "")); }
  catch(e){ main.innerHTML = `<div class="errbox">読み込みに失敗しました:\n${esc(e.message || e)}</div>`; }
}
window.addEventListener("hashchange", route);

let HSORT = {key:"dia", dir:-1};
function hSort(k){ HSORT = {key:k, dir: HSORT.key === k ? -HSORT.dir : -1}; renderHomeTable(); }
function creatorRowsSorted(rows, sort){
  const val = r => sort.key === "dia" ? r.month.dia : sort.key === "days" ? r.month.days
    : sort.key === "hours" ? r.month.hours
    : sort.key === "goal" ? (r.goal && r.goal.goal_valid_days ? r.goal.goal_valid_days.pct : -1)
    : r.month.dia;
  return [...rows].sort((a, b) => (val(a) - val(b)) * sort.dir);
}
function renderHomeTable(){
  if(!HOME) return;
  const all = HOME.cr.empty ? [] : HOME.cr.rows.filter(r => !homeQuery || r.username.toLowerCase().includes(homeQuery));
  const rows = creatorRowsSorted(all, HSORT);
  const SIZE = 12, pages = Math.max(1, Math.ceil(rows.length / SIZE));
  homePage = Math.min(homePage, pages - 1);
  const view = rows.slice(homePage * SIZE, homePage * SIZE + SIZE);
  const arr = k => HSORT.key === k ? (HSORT.dir === -1 ? " ↓" : " ↑") : "";
  let h = `<div class="tbl-head"><div class="sec-h" style="margin-right:auto">ライバー一覧</div>
    <div style="font-size:12px;color:var(--sub)">見出しクリックで並べ替え</div>
    <button class="btn2 sm" onclick="homeCSV()">CSV出力</button></div>
  <div class="tblwrap"><table class="dt" style="min-width:980px"><thead><tr>
    <th>ライバー</th>
    <th class="num sortable" onclick="hSort('dia')">ダイヤ${arr("dia")}</th>
    <th class="num sortable" onclick="hSort('days')">有効LIVE日数${arr("days")}</th>
    <th class="num sortable" onclick="hSort('hours')">配信時間${arr("hours")}</th>
    <th class="ctr">ランク</th><th class="ctr">ai-bo</th><th class="ctr">ランクアップ該当</th>
    <th style="width:130px">アクティブ度</th><th>担当</th><th>状態</th></tr></thead><tbody>`;
  for(const r of view){
    const actPct = Math.min(100, Math.round((r.month.days / 22) * 100));
    h += `<tr>
      <td><a onclick="location.hash='creator='+encodeURIComponent('${esc(r.username)}')" style="font-weight:500">${esc(r.username)}</a></td>
      <td class="num num6">${fmt(r.month.dia)}</td>
      <td class="num">${r.month.days}日</td>
      <td class="num">${r.month.hours}h</td>
      <td class="ctr"><span style="font-weight:700;font-size:12px">Lv${r.rank.current_rank}</span></td>
      <td class="ctr" style="font-size:12px;font-weight:600;color:var(--accent)">${esc(r.aibo_rank.name)}</td>
      <td class="ctr" style="font-size:12px;font-weight:600;color:${r.rank.qualified ? "var(--green)" : "var(--sub)"}">${r.rank.qualified ? "◎" : "−"}</td>
      <td><div style="display:flex;align-items:center;gap:8px">
        <div class="track mini" style="flex:1"><span style="width:${actPct}%;background:${actPct >= 60 ? "var(--green)" : actPct >= 30 ? "var(--orange)" : "var(--sub)"}"></span></div>
        <span style="font-size:11px;color:var(--sub);width:26px;text-align:right;font-variant-numeric:tabular-nums">${actPct}</span></div></td>
      <td>${esc(r.manager ? r.manager.split("@")[0] : "—")}</td>
      <td>${stBadge(stKey(r))}</td></tr>`;
  }
  if(!view.length) h += `<tr><td colspan="10" style="color:var(--sub)">該当するライバーがいません。</td></tr>`;
  h += `</tbody></table></div>
  <div class="tbl-foot"><span>${rows.length ? homePage*SIZE+1 : 0}–${Math.min(rows.length, (homePage+1)*SIZE)} / ${rows.length}名</span>
    <div style="display:flex;gap:6px">

      <button class="btn2 xs" ${homePage >= pages-1 ? "disabled" : ""} onclick="homePage++;renderHomeTable()">次へ</button>
    </div></div>`;
  $("#home-table").innerHTML = h;

async function act(creatorId, kind, action){
  try{
    const res = await fetch("/api/admin/dashboard/action", {method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({creator_id: creatorId, alert_kind: kind, action})});
    if(!res.ok) throw new Error("HTTP " + res.status);

      : action === "snooze7" ? "7日間スヌーズしました" : "今後表示しません");
    route();
  }catch(e){ toast("記録に失敗しました: " + e); }
}

function crSort(k){ CRSORT = {key:k, dir: CRSORT.key === k ? -CRSORT.dir : -1}; renderCrTable(); }
function renderCrTable(){

function scenePill(scene){
  const s = String(scene || "");
  const cls = /ランク|祝/.test(s) ? "purple" : /引き戻し|放置|減速|停止/.test(s) ? "orange"
    : /取り次ぎ|質問/.test(s) ? "accent" : "green";
  return `<span class="pill ${cls}">${esc(s)}</span>`;
}

function bcTarget(){

    return {kind: "handles", handles: v.split(/[,、\s]+/).map(s => s.trim()).filter(Boolean)};

}
async function bcPreview(){

async function bcSend(){
  const body = $("#bc-body").value.trim();
  const box = $("#bc-result");
  if(!body){ toast("本文を入力してください"); return; }
  if(!confirm("この内容でLINEを一斉送信します。送信後の取り消しはできません。よろしいですか？")) return;
  box.innerHTML = `<div class="loading" style="padding:.5rem;text-align:left">送信中…</div>`;
  try{
    const res = await fetch("/api/admin/dashboard/broadcast/send", {method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({body, target: bcTarget()})});

function pushSelected(){
  const set = new Set([...document.querySelectorAll(".push-ck:checked")].map(c => c.value));
  ($("#push-extra").value || "").split(/[,、\s]+/).forEach(h => {
    h = h.trim().replace(/^[@＠]/, ""); if(h) set.add(h);
  });
  return [...set];
}
function renderPushResults(box, results, sent){
  box.innerHTML = (sent != null
    ? `<div class="up" style="margin-bottom:8px">✓ ${sent}名に送信しました。</div>`

      <div style="font-weight:600;font-size:13px">${esc(r.handle)}
        <span style="font-weight:400;color:var(--sub);font-size:12px">${r.status === "sent" ? "✓送信済み" : r.status === "skip" ? "対象外" : "プレビュー"}</span></div>
      <div style="font-size:13px;white-space:pre-wrap;margin-top:6px;background:var(--bg);border-radius:8px;padding:10px 12px">${esc(r.message)}</div></div>`).join("");
}
async function pushPreview(){

  if(!handles.length){ toast("対象を選んでください"); return; }
  box.innerHTML = `<div class="loading">文面を生成中…（${handles.length}名・1人あたり数秒）</div>`;
  try{
    const res = await fetch("/api/admin/dashboard/push/preview", {method:"POST",
      headers:{"Content-Type":"application/json"}, body: JSON.stringify({handles})});
    const r = await res.json(); if(r.error) throw new Error(r.error);
    renderPushResults(box, r.results, null);
  }catch(e){ box.innerHTML = `<div class="errbox">生成に失敗しました:\n${esc(e.message || e)}</div>`; }
}
async function pushSend(){
  const handles = pushSelected(); const box = $("#push-result");
  if(!handles.length){ toast("対象を選んでください"); return; }
  if(!confirm(`${handles.length}名にai-boからLINEを実送信します。よろしいですか？`)) return;
  box.innerHTML = `<div class="loading">送信中…（${handles.length}名）</div>`;
  try{
    const res = await fetch("/api/admin/dashboard/push/send", {method:"POST",

}

/* ai-bo通話の利用状況（分課金なので使いすぎに気づけるようにする） */
function callSection(c){
  if(!c || c.error) return "";
  const mins = s => Math.floor((s || 0) / 60) + "分" + String((s || 0) % 60).padStart(2, "0") + "秒";
  const cap = c.limits.agency_min * 60;
  const pct = cap ? Math.min(100, Math.round(c.total_seconds / cap * 100)) : 0;
  let h = `<section class="card"><div style="display:flex;align-items:baseline;gap:10px;flex-wrap:wrap">
      <div class="sec-h">ai-bo通話の利用状況（${esc(c.month)}）</div>
      ${c.enabled ? "" : '<span class="pill gray">未設定（OPENAI_API_KEYを入れると使えます）</span>'}
      <span class="note">1人あたり月${c.limits.per_month_min}分・1回${c.limits.per_call_min}分まで</span></div>
    <div class="tiles" style="margin-top:12px">
      ${kpiTile(`<div class="kpi-lbl">今月の通話時間</div>`,
        `<div class="kpi-num">${Math.floor(c.total_seconds / 60)}<small> 分</small></div>`,
        `<div class="kpi-sub"><span class="dim">${c.usage.length}名が利用</span></div>`)}
      ${kpiTile(`<div class="kpi-lbl">概算の費用</div>`,
        `<div class="kpi-num" style="font-size:24px">$${c.est_usd_low}〜${c.est_usd_high}</div>`,
        `<div class="kpi-sub"><span class="dim">実測レンジからの目安です</span></div>`)}
      ${cap ? kpiTile(`<div class="kpi-lbl">全体ブレーカー</div>`,
        `<div class="kpi-num">${pct}<small>%</small></div>`,
        `<div class="track" style="margin-top:8px"><span style="width:${pct}%;background:${pct >= 80 ? "var(--red)" : "var(--accent)"}"></span></div>
         <div class="note">上限 ${c.limits.agency_min}分／月に達すると通話を止めます</div>`) : ""}
    </div>`;
  if(c.usage.length){
    h += `<div class="tblwrap"><table class="dt"><thead><tr><th>名前</th><th class="num">通話時間</th>
      <th class="num">回数</th><th class="num">残り</th><th>気にかけ</th></tr></thead><tbody>`;
    for(const u of c.usage){
      const remain = Math.max(0, c.limits.per_month_min * 60 - u.seconds);
      h += `<tr><td style="font-weight:500">${esc(u.tiktok_id)}</td>
        <td class="num num6">${mins(u.seconds)}</td><td class="num">${u.calls}</td>
        <td class="num" style="color:${remain <= 300 ? "var(--red)" : "var(--sub)"}">${Math.floor(remain / 60)}分</td>
        <td>${u.flagged ? '<span class="pill red">' + u.flagged + '件</span>' : "—"}</td></tr>`;
    }
    h += `</tbody></table></div>`;
  } else {
    h += `<div class="empty">まだ通話の利用がありません。</div>`;
  }
  if(c.sessions.length){
    h += `<details class="tbl" style="margin-top:10px"><summary>通話の記録（文字起こし・直近${c.sessions.length}件）</summary>`;
    for(const s of c.sessions){
      h += `<details style="border-bottom:1px solid var(--border);padding:8px 0">
        <summary style="cursor:pointer;font-size:13px;list-style:none;display:flex;gap:10px;flex-wrap:wrap;align-items:center">
          <span style="color:var(--sub);font-size:11px">${esc(s.at)}</span>
          <span style="font-weight:600">${esc(s.tiktok_id)}</span>
          <span class="pill accent">${mins(s.seconds)}</span>
          ${s.flagged ? '<span class="pill red">気にかけ</span>' : ""}</summary>
        <div style="font-size:12.5px;white-space:pre-wrap;background:var(--bg);border-radius:8px;
          padding:10px 12px;margin:8px 0 4px;max-height:300px;overflow-y:auto">${esc(s.transcript || "（文字起こしなし）")}</div></details>`;
    }
    h += `</details>`;
  }
  h += `<div class="note" style="margin-top:10px">通話の内容は、文字チャットと同じ安全確認にかけています。
    深刻な相談を検知した場合は運営LINEにお知らせが届きます（通話後の事後通知です）。</div></section>`;
  return h;
}
let OPS = null, OPSNAME = "";

  if(!d.history.length) html += `<tr><td colspan="4" style="color:var(--sub)">まだ履歴がありません。</td></tr>`;
  for(const r of d.history){
    const [lbl, col] = RESULT[r.status] || [r.label, "var(--sub)"];
    const rep = r.reports || {};
    const repTxt = (rep.requester || rep.target)
      ? `${REPORT_LABEL[rep.requester] || rep.requester || "—"} / ${REPORT_LABEL[rep.target] || rep.target || "—"}` : "—";
    html += `<tr><td>${esc(r.closed || r.created)}</td><td style="font-weight:500">${esc(r.requester)} × ${esc(r.target)}</td>
      <td><span class="badge" style="background:var(--surface2);color:${col}"><span class="dot" style="background:${col}"></span>${esc(lbl)}</span></td>
      <td style="font-size:12px;color:var(--sub)">${esc(repTxt)}</td></tr>`;
  }
  html += `</tbody></table></div></section>`;
  main.innerHTML = html;
  if(window.matchMedia("(max-width:900px)").matches) $("#collab-mid").style.gridTemplateColumns = "1fr";
}

/* 取り込めていない日の一覧。月ごとの日数だけでは「どの日が抜けたか」が分からないため。 */
function gapsBlock(g, pad){
  if(!g || !g.since) return "";
  pad = pad === undefined ? "10px 20px 0" : pad;
  const miss = g.missing || [];
  const md = iso => { const p = String(iso).split("-"); return `${+p[1]}/${+p[2]}`; };
  const range = `${md(g.since)}〜${md(g.until)}`;
  if(!miss.length){
    return `<div style="padding:${pad}"><div class="note" style="color:var(--green)">
      ✅ 取り込めていない日はありません（${esc(range)} を確認）</div></div>`;
  }
  return `<div style="padding:${pad}">
    <div class="errbox" style="white-space:normal">
      <b>⚠ 取り込めていない日が ${miss.length}日あります</b>
      <div style="margin-top:6px;display:flex;gap:6px;flex-wrap:wrap">
        ${miss.map(x => `<span class="pill" style="background:var(--orange-soft,#fdf1e3);
          color:var(--orange,#d9821f);font-weight:700">${esc(md(x))}</span>`).join("")}
      </div>
      <div class="note" style="margin-top:8px">${esc(range)} を確認した結果です。
        データは約${g.lag_days}日遅れで届くため、直近${g.lag_days}日は確認の対象外です。</div>
    </div></div>`;
}

let TIERS = null, TIERPROG = "", REVMONTHS = {}, REVMONTH = "";
const PROG_LABEL = {RANK_UP:"ランクアップ", RANK_KEEP:"ランク維持", ACTIVITY:"アクティブ度", REVENUE:"売上増加"};
function progPillOf(p){
  return p === "RANK_UP" ? '<span class="pill green">RANK_UP</span>'
    : p === "RANK_KEEP" ? '<span class="pill purple">RANK_KEEP</span>'
    : p === "ACTIVITY" ? '<span class="pill accent">ACTIVITY</span>' : '<span class="pill orange">REVENUE</span>';
}
function renderTiers(){
  if(!TIERS) return;
  // 月次で手入力した売上増加の境界値は専用フォームで扱うので、基準値の表からは除く
  const base = TIERS.filter(t => !t.monthly);
  const counts = {};
  for(const t of base) counts[t.program] = (counts[t.program] || 0) + 1;
  const order = ["RANK_UP", "RANK_KEEP", "ACTIVITY", "REVENUE"].filter(p => counts[p]);
  $("#tier-tabs").innerHTML = [["", "全て", base.length], ...order.map(p => [p, PROG_LABEL[p] || p, counts[p]])]
    .map(([v, label, n]) => `<button class="ptab ${TIERPROG === v ? "on" : ""}"
      onclick="TIERPROG='${v}';renderTiers()">${esc(label)} <span style="opacity:.7">${n}</span></button>`).join("");
  const list = base.filter(t => !TIERPROG || t.program === TIERPROG);
  const revForm = TIERPROG === "REVENUE" ? revenueMonthForm() : "";
  // 売上増加の必要ダイヤは月ごとに変わるため、選択中の月に入力済みの値を差し込んで表示する
  const revByOrder = {};
  for(const r of (REVMONTHS[REVMONTH] || [])) revByOrder[r.tier_order] = r.req_diamonds;
  const diaCell = t => {
    if(t.program === "REVENUE" && t.req_diamonds == null){
      const v = revByOrder[t.tier_order];
      return v == null
        ? `<span style="color:var(--sub);font-size:12px">未入力</span>`
        : `${fmt(v)} <span style="color:var(--sub);font-size:11px">${esc(REVMONTH)}</span>`;
    }
    return t.req_diamonds == null ? "—" : fmt(t.req_diamonds);
  };
  const hasRev = list.some(t => t.program === "REVENUE");
  $("#tier-table").innerHTML = revForm + `<div class="tblwrap"><table class="dt" style="min-width:860px"><thead><tr>
      <th>プログラム</th><th>段階</th><th class="num">必要有効日</th><th class="num">必要時間</th>
      <th class="num">必要ダイヤ</th><th class="num">報酬率</th><th>有効期間</th><th></th></tr></thead><tbody>
    ${list.map(t => `<tr><td>${progPillOf(t.program)}</td><td style="font-weight:500">${esc(t.tier_name || "")}</td>
      <td class="num">${t.req_effective_days ?? "—"}</td><td class="num">${t.req_live_hours ?? "—"}</td>
      <td class="num">${diaCell(t)}</td>
      <td class="num num6">${t.reward_rate ?? "—"}%</td>
      <td style="font-size:12px;color:var(--sub)">${esc(t.valid_from || "")}〜${esc(t.valid_to || "")}</td>
      <td><button class="btn2 xs" onmouseover="this.style.color='var(--red)';this.style.borderColor='var(--red)'"
        onmouseout="this.style.color='';this.style.borderColor=''" onclick="closeTier(${t.id})">締める</button></td></tr>`).join("")
      || `<tr><td colspan="8" style="color:var(--sub)">該当する基準値がありません。</td></tr>`}
    </tbody></table></div>`
    + (hasRev ? `<div class="note" style="padding:10px 20px 0">
      売上増加の報酬率（規定）は毎月共通ですが、<b>必要ダイヤは毎月変わる</b>ため
      ${TIERPROG === "REVENUE" ? "上のフォームで登録した" : `<a onclick="TIERPROG='REVENUE';renderTiers()">売上増加タブ</a>で登録した`}
      <b>${esc(REVMONTH)}</b> の値を表示しています。</div>` : "");
}
/* 売上増加インセンティブ: その月の境界ダイヤ7段階をまとめて入力するフォーム */
function revenueMonthForm(){
  const rates = {};
  for(const t of TIERS) if(t.program === "REVENUE" && !t.monthly) rates[t.tier_order] = t.reward_rate;
  const saved = REVMONTHS[REVMONTH] || [];
  const byOrder = {};
  for(const r of saved) byOrder[r.tier_order] = r.req_diamonds;
  const done = saved.length > 0;
  const months = Object.keys(REVMONTHS).sort().reverse();
  let h = `<div style="margin:14px 20px 4px;border:1px solid var(--border);border-radius:12px;padding:16px 18px;background:var(--bg)">
    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
      <div class="sec-h">今月の境界ダイヤを入力</div>
      ${done ? '<span class="pill green">登録済み</span>' : '<span class="pill orange">未登録</span>'}
      <input type="month" id="rev-month" class="tinput" style="height:32px;margin-left:auto" value="${esc(REVMONTH)}">
    </div>
    <div class="note" style="margin:6px 0 12px">TikTokが毎月設定する各Tierの必要ダイヤ（事務所合計）を入れてください。入力し直すとその月の値だけが置き換わります（他の月には影響しません）。</div>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px">`;
  for(let i = 1; i <= 7; i++){
    h += `<div><div style="font-size:11px;color:var(--sub);margin-bottom:4px">Tier${i}
      <span style="font-weight:600">${rates[i] != null ? rates[i] + "%" : ""}</span></div>
      <input class="tinput rev-in" data-tier="${i}" style="width:100%;height:32px"
        inputmode="numeric" placeholder="必要ダイヤ" value="${byOrder[i] != null ? byOrder[i] : ""}"></div>`;
  }
  h += `</div>
    <div style="display:flex;gap:10px;align-items:center;margin-top:12px;flex-wrap:wrap">
      <button class="btn sm" onclick="saveRevenueMonth()">この月の境界値を保存</button>
      ${months.length ? `<span class="note">登録済みの月：${months.map(m => `<a onclick="REVMONTH='${m}';renderTiers()">${esc(m)}</a>`).join(" / ")}</span>` : ""}
      <span id="rev-result" style="font-size:12.5px"></span></div></div>`;
  return h;
}
async function saveRevenueMonth(){
  const month = $("#rev-month").value;
  const box = $("#rev-result");
  if(!month){ toast("対象月を選んでください"); return; }
  const boundaries = {};
  document.querySelectorAll(".rev-in").forEach(el => {
    const v = (el.value || "").replace(/[,\s]/g, "");
    if(v !== "") boundaries[el.dataset.tier] = v;
  });
  if(!Object.keys(boundaries).length){ toast("必要ダイヤを入力してください"); return; }
  box.innerHTML = `<span style="color:var(--sub)">保存中…</span>`;
  try{
    const res = await fetch("/api/admin/dashboard/tiers/revenue-month", {method:"POST",
      headers:{"Content-Type":"application/json"}, body: JSON.stringify({month, boundaries})});
    const r = await res.json(); if(r.error) throw new Error(r.error);
    toast(`${month} の境界値を保存しました（${r.saved}段階）`);
    REVMONTH = month;
    route();
  }catch(e){ box.innerHTML = `<span style="color:var(--red)">${esc(e.message || e)}</span>`; }
}
async function tool(name, payload, confirmMsg){
  if(confirmMsg && !confirm(confirmMsg)) return;
  const box = $("#tool-result");
  box.innerHTML = `<span style="color:var(--sub)">実行中…</span>`;
  try{
    const res = await fetch("/api/admin/dashboard/tools/" + name, {method:"POST",
      headers:{"Content-Type":"application/json"}, body: JSON.stringify(payload || {})});
    const r = await res.json(); if(r.error) throw new Error(r.error);
    box.innerHTML = `<span class="up">✓ ${esc(r.message)}</span>`;
    toast("実行しました");
  }catch(e){ box.innerHTML = `<div class="errbox">失敗しました:\n${esc(e.message || e)}</div>`; }
}
async function closeTier(id){
  const today = new Date().toISOString().slice(0, 10);
  const d = prompt("この行の有効終了日（YYYY-MM-DD）を入力してください。\nこの日までは有効なまま、翌日以降は使われなくなります。", today);
  if(!d) return;
  try{
    const res = await fetch("/api/admin/dashboard/tiers/close", {method:"POST",
      headers:{"Content-Type":"application/json"}, body: JSON.stringify({id, valid_to: d})});
    const r = await res.json(); if(r.error) throw new Error(r.error);
    toast("行を締めました"); route();
  }catch(e){ toast("失敗しました: " + (e.message || e)); }
}
async function addTier(){
  const payload = {
    program: $("#tr-prog").value, tier_name: $("#tr-name").value,
    tier_order: $("#tr-order").value, req_diamonds: $("#tr-dia").value,
    reward_rate: $("#tr-rate").value, valid_from: $("#tr-from").value,
    valid_to: $("#tr-to").value,
    scope: $("#tr-prog").value === "REVENUE" ? "AGENCY" : "CREATOR",
    note: "ダッシュボードから手入力",
  };
  try{
    if(!payload.valid_from) throw new Error("有効開始日を入れてください。");
    const res = await fetch("/api/admin/dashboard/tiers/add", {method:"POST",
      headers:{"Content-Type":"application/json"}, body: JSON.stringify(payload)});
    const r = await res.json(); if(r.error) throw new Error(r.error);
    toast("追加しました"); route();
  }catch(e){ $("#tier-result").innerHTML = `<div class="errbox">追加に失敗しました:\n${esc(e.message || e)}</div>`; }
}

route();
